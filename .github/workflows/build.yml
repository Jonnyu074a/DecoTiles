name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Generar también el APK release firmado (requiere los secretos de firma)"
        type: boolean
        default: false

jobs:
  check:
    name: Lint, tests y APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Miuix 0.9.4 se compila con JDK 21: el proyecto necesita el mismo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Permisos del wrapper
        run: chmod +x gradlew

      - name: Lint, tests unitarios y APK debug
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DecoCenter-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: APK release firmado
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Comprobar secretos de firma
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto KEYSTORE_B64 (ver README, sección Firma)."
            exit 1
          fi

      - name: Preparar el keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/decocenter.jks"

      - name: Compilar release firmado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/decocenter.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DecoCenter-release-apk
          path: app/build/outputs/apk/release/*.apk
